name: Release draft

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Exact version tag (for example, v3.1.28)
        required: true
        type: string

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    environment: production-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
      - name: Install validation tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gettext zip ripgrep
      - name: Validate required commands
        run: |
          set -euo pipefail
          command -v rg
          command -v msgfmt
          command -v zip
      - name: Validate
        run: |
          set -euo pipefail
          bash scripts/validate_i18n_and_php.sh
          bash -n scripts/validate_i18n_and_php.sh
          bash -n scripts/package_release.sh
          bash -n scripts/read_plugin_version.sh
          bash -n scripts/check_forbidden_references.sh
          bash scripts/check_forbidden_references.sh
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          test -f "docs/releases/${RELEASE_TAG}.md"
          bash scripts/package_release.sh --tag "$RELEASE_TAG" --dry-run
      - name: Package
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          bash scripts/package_release.sh --tag "$RELEASE_TAG"
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" dist/ebenezerclone-*.zip dist/ebenezerclone-*.tar.gz dist/SHA256SUMS dist/RELEASE-MANIFEST.json \
            --draft --title "Ebenezer Clone ${RELEASE_TAG#v}" --notes-file "docs/releases/${RELEASE_TAG}.md"
