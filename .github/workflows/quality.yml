name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
      - name: Install validation tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gettext zip
      - name: PHP lint and i18n
        run: bash scripts/validate_i18n_and_php.sh
      - name: Validate shell script
        run: bash -n scripts/package_release.sh
      - name: Check forbidden client references
        run: >-
          ! rg -n -i -P '(?<![\p{L}\p{N}_])(trt|tribunal(?:\s+regional\s+do\s+trabalho)?|poder\s+judiciário|judiciário|judiciario|cnj|pje)(?![\p{L}\p{N}_])'
          . -g '!.git/**' -g '!.github/**' -g '!inc/config.class.php'
      - name: Package dry-run
        run: bash scripts/package_release.sh --tag v$(rg -No "PLUGIN_EBENEZERCLONE_VERSION', '[0-9]+\.[0-9]+\.[0-9]+" setup.php | sed -E "s/.*'([0-9]+\.[0-9]+\.[0-9]+)$/\1/") --dry-run
